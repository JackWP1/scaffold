# Reusable triage workflow (slice 1). Called from a repo's thin caller workflow.
name: SCAFFOLD triage
on:
  workflow_call:
    inputs:
      model:
        description: Override the fast-tier model
        type: string
        default: ''

permissions: {}

jobs:
  triage:
    if: vars.SCAFFOLD_ENABLED != 'false' && !github.event.issue.pull_request && (github.event.action != 'labeled' || github.event.label.name == 'scaffold:accepted')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: scaffold-triage-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      issues: write
      copilot-requests: write
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/actions/triage@bf1844a507c32fdc2ce01ba85decc4812b80330c # v0.1.1
        with:
          model: ${{ inputs.model }}
