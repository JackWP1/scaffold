# Reusable triage workflow (slice 1). Called from a repo's thin caller workflow.
name: SCAFFOLD triage
on:
  workflow_call:
    inputs:
      model:
        description: Override the fast-tier model
        type: string
        default: ''

permissions: {}

jobs:
  triage:
    if: vars.SCAFFOLD_ENABLED != 'false' && !github.event.issue.pull_request && (github.event.action != 'labeled' || contains(fromJSON('["scaffold:accepted","scaffold:triage"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: scaffold-triage-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      issues: write
      copilot-requests: write
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/actions/triage@30aad3bf3f143c5c13859fcf42ee9286e663e570 # v0.4.0.
        with:
          model: ${{ inputs.model }}
