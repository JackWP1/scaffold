# Reusable intake workflow (slice 1): triage. Called from a repo's thin caller workflow.
# The action reads `stages` first and does nothing else when intake is off (PLAN.md section 5).
name: SCAFFOLD triage
on:
  workflow_call:
    inputs:
      model:
        description: Override the fast-tier model
        type: string
        default: ''

permissions: {}

jobs:
  triage:
    if: vars.SCAFFOLD_ENABLED != 'false' && !github.event.issue.pull_request && (github.event.action != 'labeled' || contains(fromJSON('["scaffold:accepted","scaffold:triage"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: scaffold-triage-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      issues: write
      contents: read
      copilot-requests: write
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/packages/intake/actions/triage@fba2e6e168333e884140facc8129c48814c58b02 # v0.5.0
        with:
          model: ${{ inputs.model }}
