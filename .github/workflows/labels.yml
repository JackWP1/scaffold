# Reusable workflow that syncs SCAFFOLD labels into the calling repo.
name: SCAFFOLD labels
on:
  workflow_call:

permissions: {}

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/actions/labels@53d60216589530e15f2c331535ba04ec67e2c247 # v0.2.0
