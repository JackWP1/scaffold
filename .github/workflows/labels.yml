# Reusable workflow that syncs SCAFFOLD labels into the calling repo.
name: SCAFFOLD labels
on:
  workflow_call:

permissions: {}

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/actions/labels@30aad3bf3f143c5c13859fcf42ee9286e663e570 # v0.4.0.
