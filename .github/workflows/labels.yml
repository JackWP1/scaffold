# Reusable workflow that syncs SCAFFOLD labels into the calling repo.
name: SCAFFOLD labels
on:
  workflow_call:

permissions: {}

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/packages/core/actions/labels@b965cd502dddcb8ed394742fc9ba04a870498aac # v0.9.0
