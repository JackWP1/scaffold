# Reusable workflow that syncs SCAFFOLD labels into the calling repo.
name: SCAFFOLD labels
on:
  workflow_call:

permissions: {}

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/packages/core/actions/labels@987c7e4739635b8ece75fb8ef92e7bb1f037e225 # v0.7.0
