# Reusable workflow that syncs SCAFFOLD labels into the calling repo.
name: SCAFFOLD labels
on:
  workflow_call:

permissions: {}

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/actions/labels@2cdc6ded591025cf7388d5d1174d7c8f271fbba0 # v0.1.0
