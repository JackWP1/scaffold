# Reusable core job (always on): weekly usage report (PLAN.md section 7).
name: SCAFFOLD usage report
on:
  workflow_call:

permissions: {}

jobs:
  usage-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/packages/core/actions/usage-report@987c7e4739635b8ece75fb8ef92e7bb1f037e225 # v0.7.0
