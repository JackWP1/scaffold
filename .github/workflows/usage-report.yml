# Reusable core job (always on): weekly usage report (PLAN.md section 7).
name: SCAFFOLD usage report
on:
  workflow_call:

permissions: {}

jobs:
  usage-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/packages/core/actions/usage-report@b965cd502dddcb8ed394742fc9ba04a870498aac # v0.9.0
