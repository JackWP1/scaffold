# Reusable core job (always on): weekly usage report (PLAN.md section 7).
name: SCAFFOLD usage report
on:
  workflow_call:

permissions: {}

jobs:
  usage-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/packages/core/actions/usage-report@2794477f75c54702cbf71973707bf271db431780 # v0.6.0
