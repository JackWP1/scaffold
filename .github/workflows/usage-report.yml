# Reusable core job (always on): weekly usage report (PLAN.md section 7).
name: SCAFFOLD usage report
on:
  workflow_call:

permissions: {}

jobs:
  usage-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Pinned to a release SHA by scripts/release.sh (PLAN.md section 5).
      - uses: JackWP1/scaffold/packages/core/actions/usage-report@2f1cc8c0eead47af3b1f73e5988a7d982f31ac34 # v0.8.0
