# Thin SCAFFOLD caller. Copy to .github/workflows/scaffold.yml in your repo.
# Refs are pinned to a release SHA by scripts/release.sh; keep them pinned.
name: SCAFFOLD
on:
  issues:
    types: [opened, edited, reopened, labeled]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions: {}

jobs:
  triage:
    if: github.event_name == 'issues'
    permissions:
      issues: write
      copilot-requests: write
    uses: JackWP1/scaffold/.github/workflows/triage.yml@ae3484416ac3103d15f05582942806700c81237a # v0.3.0

  # `/plan` comments, scaffold:plan-approved and edits to the plan comment.
  plan:
    if: github.event_name == 'issue_comment' || (github.event_name == 'issues' && github.event.label.name == 'scaffold:plan-approved')
    permissions:
      issues: write
      contents: read
      copilot-requests: write
    uses: JackWP1/scaffold/.github/workflows/plan.yml@ae3484416ac3103d15f05582942806700c81237a # v0.3.0

  # Run manually (Actions → SCAFFOLD → Run workflow) to create the labels.
  labels:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
    uses: JackWP1/scaffold/.github/workflows/labels.yml@ae3484416ac3103d15f05582942806700c81237a # v0.3.0
