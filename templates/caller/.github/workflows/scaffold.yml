# Thin SCAFFOLD caller. Copy to .github/workflows/scaffold.yml in your repo.
# Refs are pinned to a release SHA by scripts/release.sh; keep them pinned.
# Which packages run is set by `stages` in .github/scaffold-config.yml, not here.
name: SCAFFOLD
on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  # Every required SCAFFOLD check also runs in the merge queue (PLAN.md section 8).
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [labels, usage-report]
        default: labels

permissions: {}

jobs:
  # Intake package: triage, `/gherkin`, and the scenarios gate (scaffold:gherkin-approved and
  # scaffold:needs-gherkin applied or removed; edits to or deletion of the scenarios comment).
  triage:
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    permissions:
      issues: write
      contents: read
      copilot-requests: write
    uses: JackWP1/scaffold/.github/workflows/triage.yml@dd19021da0c48cf5766cc3fcf02deeb2d5262b32 # v0.9.0

  # Plan package: `/plan` comments, scaffold:plan-approved, edits to or deletion of the plan or scenarios
  # comment, and scaffold:gherkin-approved removed (an approved plan is re-checked).
  plan:
    if: github.event_name == 'issue_comment' || (github.event_name == 'issues' && ((github.event.action == 'labeled' && github.event.label.name == 'scaffold:plan-approved') || (github.event.action == 'unlabeled' && github.event.label.name == 'scaffold:gherkin-approved')))
    permissions:
      issues: write
      contents: read
      copilot-requests: write
    uses: JackWP1/scaffold/.github/workflows/plan.yml@dd19021da0c48cf5766cc3fcf02deeb2d5262b32 # v0.9.0

  # Implement package: plan gate, PR size and review gate checks on PRs, automatic rework, and
  # `/size-exception` comments on PRs. Make `implement / scaffold-plan-gate`, `implement / scaffold-pr-size`
  # and `implement / scaffold-review-gate` required checks.
  implement:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: write
    uses: JackWP1/scaffold/.github/workflows/implement.yml@dd19021da0c48cf5766cc3fcf02deeb2d5262b32 # v0.9.0

  # Review package: code-review and ci-diagnose on PRs. They only comment; the review gate waits for
  # code-review threads to be resolved.
  review:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: JackWP1/scaffold/.github/workflows/review.yml@dd19021da0c48cf5766cc3fcf02deeb2d5262b32 # v0.9.0

  # Collaboration package: conflict-check after plan approval and after an approving review, conflict
  # resolution, merge order. Make `collaboration / scaffold-merge-order` a required check.
  collaboration:
    if: github.event_name == 'merge_group' || github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || (github.event_name == 'issues' && contains(fromJSON('["scaffold:plan-approved","scaffold:conflict-resolved","scaffold:conflict"]'), github.event.label.name))
    permissions:
      contents: read
      issues: write
      pull-requests: read
      copilot-requests: write
    uses: JackWP1/scaffold/.github/workflows/collaboration.yml@dd19021da0c48cf5766cc3fcf02deeb2d5262b32 # v0.9.0

  # Core, always on: make `config-guard / scaffold-config-guard` a required check in the ruleset.
  config-guard:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    uses: JackWP1/scaffold/.github/workflows/config-guard.yml@dd19021da0c48cf5766cc3fcf02deeb2d5262b32 # v0.9.0

  # Core, always on: baseline PR checks. Make each `checks / scaffold-*` job a required check in the ruleset.
  checks:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    uses: JackWP1/scaffold/.github/workflows/checks.yml@dd19021da0c48cf5766cc3fcf02deeb2d5262b32 # v0.9.0

  # Core, always on: weekly, or run manually (Actions → SCAFFOLD → Run workflow → usage-report).
  usage-report:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task == 'usage-report')
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    uses: JackWP1/scaffold/.github/workflows/usage-report.yml@dd19021da0c48cf5766cc3fcf02deeb2d5262b32 # v0.9.0

  # Run manually (Actions → SCAFFOLD → Run workflow → labels) to create the labels.
  labels:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'labels'
    permissions:
      issues: write
    uses: JackWP1/scaffold/.github/workflows/labels.yml@dd19021da0c48cf5766cc3fcf02deeb2d5262b32 # v0.9.0
