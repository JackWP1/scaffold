# SCAFFOLD settings for this repo (PLAN.md sections 5, 6 and 8). Protect with CODEOWNERS.
# scaffold-config-guard requires a listed approver's review for changes to stages, approvers, gherkin, bdd and limits.

# Packages on (true) or off (false). A package not listed is off; when one is off, humans do that
# stage by hand (packages/<stage>/HANDOFF.md). Only released packages can be turned on.
stages:
  intake: true
  plan: true
  implement: false        # not released yet (slice 3)
  review: false           # not released yet (slice 4)
  collaboration: false    # not released yet (slice 5)

# GitHub logins that can approve plans and scenarios (scaffold:plan-approved, scaffold:gherkin-approved). The issue author can't approve their own issue.
approvers:
  - your-login

# Rotating developer who orders the backlog and watches escalations (changed by PR each rotation).
flow_lead: your-login

# Acceptance scenarios in Gherkin (PLAN.md section 2, Scenarios): off, auto (triage decides) or always.
# Turning them on means adding `bdd` in the same PR: the CI workflow and artifact holding its
# Cucumber JSON report, read by the scenarios check.
gherkin: off
# bdd:
#   workflow: ci.yml
#   artifact: scaffold-bdd-report

# Tickets in flight at once, from /plan until merged, closed, too big or back to Ready; 1–100.
max_in_flight: 20

# PRs in one ticket's stack; a plan that needs more is too big and goes back to triage; 1–10.
max_stack_prs: 5

# Open Copilot PRs per developer before a warning (advisory, slice 3); 1–10.
warn_open_prs_per_developer: 2

# Automatic rework rounds before the circuit breaker (slice 3); 1–10.
max_rework_rounds: 6

# PR size limits; work over the soft limit is planned as a stack of up to max_stack_prs PRs.
pr_size:
  soft:
    files: 10
    lines: 1000
  hard:
    files: 30
    lines: 5000
  exempt:
    - package-lock.json
    - yarn.lock
    - pnpm-lock.yaml
    - dist/**
