name: SCAFFOLD labels
description: Create or update the SCAFFOLD labels in this repo.
inputs:
  github-token:
    description: Token with issues:write
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SCAFFOLD_ROOT: ${{ github.action_path }}/../..
      run: node "$GITHUB_ACTION_PATH/labels.mjs"
