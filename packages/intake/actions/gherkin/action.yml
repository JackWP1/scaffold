name: SCAFFOLD gherkin
description: On `/gherkin`, draft or redraft an issue's acceptance scenarios with a single tool-less Copilot CLI call, for a listed approver to approve. Skipped when the intake stage is off.
inputs:
  github-token:
    description: Token with issues:write, contents:read and copilot-requests:write
    default: ${{ github.token }}
  model:
    description: Override the model for this skill's tier (packages/core/config/models.yml)
    default: ''
runs:
  using: composite
  steps:
    # Reads `stages` first (PLAN.md section 5): when intake is off, nothing else runs.
    - id: stage
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/../../../core/bin/stage.mjs" intake
    # Pinned so a CLI release can't change flags or behaviour under a SCAFFOLD release.
    - if: steps.stage.outputs.state == 'on'
      shell: bash
      run: npm install -g --no-fund --no-audit @github/copilot@1.0.114
    - if: steps.stage.outputs.state != 'off'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SCAFFOLD_MODEL: ${{ inputs.model }}
      run: node "$GITHUB_ACTION_PATH/main.mjs"
