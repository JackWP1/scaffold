name: SCAFFOLD PR check
description: Run one core baseline PR check (protected paths, hard size limit). Always on, whatever `stages` says.
inputs:
  check:
    description: The check to run, e.g. scaffold-protected-paths
    required: true
  github-token:
    description: Token with contents:read and pull-requests:read
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SCAFFOLD_CHECK: ${{ inputs.check }}
      run: node "$GITHUB_ACTION_PATH/main.mjs"
