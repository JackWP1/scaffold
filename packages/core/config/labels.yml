# SCAFFOLD labels (PLAN.md section 2). Synced to a repo by the labels workflow; a core test checks them against PLAN.md.
- name: scaffold:triage
  color: "ededed"
  description: SCAFFOLD is triaging this issue
- name: scaffold:needs-info
  color: "fbca04"
  description: Triage needs answers from the author
- name: scaffold:needs-gherkin
  color: "e4e669"
  description: Needs approved Gherkin scenarios before it is ready
- name: scaffold:gherkin-approved
  color: "0052cc"
  description: Scenarios approved by a listed approver
- name: scaffold:ready
  color: "0e8a16"
  description: Triaged and ready for /plan
- name: scaffold:planned
  color: "c5def5"
  description: Plan posted; waiting for a listed approver
- name: scaffold:plan-approved
  color: "1d76db"
  description: Plan approved by a listed approver
- name: scaffold:proposed
  color: "fef2c0"
  description: Opened by a non-member; a member must apply scaffold:accepted
- name: scaffold:accepted
  color: "d4c5f9"
  description: A member accepted this issue for triage
- name: scaffold:escalate
  color: "b60205"
  description: Needs human attention
- name: scaffold:conflict
  color: "d93f0b"
  description: Conflicts with in-flight work or the spec
- name: scaffold:too-big
  color: "e99695"
  description: Needs more than max_stack_prs PRs; back to triage to split
- name: scaffold:no-template
  color: "f9d0c4"
  description: Not created from the SCAFFOLD Request template
- name: scaffold:conflict-resolved
  color: "d4c5f9"
  description: Conflict cleared by a listed approver
- name: scaffold:test-change-approved
  color: "d4c5f9"
  description: Test or scenario changes approved by a listed approver
- name: scaffold:size-exception
  color: "d4c5f9"
  description: Soft PR size limit lifted by a listed approver
- name: scaffold:order-override
  color: "d4c5f9"
  description: Merge order overridden by the flow lead
- name: scaffold:diagram-unchanged
  color: "d4c5f9"
  description: Workflow change needs no diagram update
- name: priority:high
  color: "5319e7"
  description: High priority
- name: priority:medium
  color: "8a63d2"
  description: Medium priority
- name: priority:low
  color: "c9b8f0"
  description: Low priority
