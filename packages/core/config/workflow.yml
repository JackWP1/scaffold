# The implemented workflow (PLAN.md section 10). `node packages/core/diagrams/check.mjs --write` generates
# the Current diagram in docs/diagrams/workflow.md from `diagram`, and the Actions graph in
# docs/diagrams/architecture.md from .github/workflows/*.yml. The scaffold-diagrams check (self-test)
# fails if either is stale, or if this file disagrees with labels.yml, the caller's triggers, the
# reusable workflows or the packages' skills. Same YAML subset as scaffold-config.yml: maps and lists of
# plain values; no "#" inside values.

# Labels SCAFFOLD defines for later slices, so labels.yml and this file stay in step.
reserved_labels: [scaffold:conflict, scaffold:conflict-resolved, scaffold:order-override, scaffold:diagram-unchanged]

# Core: always on. Its workflows run whatever `stages` says.
core:
  workflows: [labels.yml, config-guard.yml, usage-report.yml, checks.yml]
  checks: [scaffold-config-guard, scaffold-protected-paths, scaffold-hard-size, scaffold-test-integrity, scaffold-scenarios]
  labels: [scaffold:test-change-approved]
  triggers: [pull_request.opened, pull_request.synchronize, pull_request.reopened, pull_request.edited, pull_request.labeled, pull_request.unlabeled, pull_request_review.submitted, pull_request_review.dismissed, schedule, workflow_dispatch]

# Packages, in workflow order. Each is switched by `stages` in scaffold-config.yml.
stages:
  intake:
    workflow: triage.yml
    skills: [triage, gherkin-writer]
    triggers: [issues.opened, issues.edited, issues.reopened, issues.labeled, issues.unlabeled, issue_comment.created, issue_comment.edited, issue_comment.deleted]
    labels: [scaffold:triage, scaffold:needs-info, scaffold:needs-gherkin, scaffold:gherkin-approved, scaffold:ready, scaffold:proposed, scaffold:accepted, scaffold:no-template, priority:high, priority:medium, priority:low]
    gates: [Triaged → ready, Scenarios → approved]
  plan:
    workflow: plan.yml
    skills: [task-decomposer]
    triggers: [issue_comment.created, issue_comment.edited, issue_comment.deleted, issues.labeled, issues.unlabeled]
    labels: [scaffold:planned, scaffold:plan-approved, scaffold:too-big]
    gates: [Ready → planned, Planned → approved, Planned → too big]
  implement:
    workflow: implement.yml
    skills: []
    checks: [scaffold-plan-gate, scaffold-pr-size, scaffold-review-gate]
    triggers: [pull_request.opened, pull_request.synchronize, pull_request.reopened, pull_request.edited, pull_request.labeled, pull_request.unlabeled, issue_comment.created]
    labels: [scaffold:size-exception, scaffold:escalate]
    gates: [Approved → implementing, Oversized PR → exception, Review gate fails → rework, Copilot PR → human review]

# The Current diagram. kind: human (a person must act), check (automated), ai (model step) or state.
# owner: scaffold (a package or core runs it) or manual. Edges use Mermaid syntax: a --> b or a -- label --> b.
diagram:
  nodes:
    jira:
      owner: manual
      text: Jira ticket created
    open:
      kind: human
      owner: manual
      text: Developer opens issue<br/>via Request form
    intakeon:
      kind: check
      text: intake stage on?<br/>stages in scaffold-config.yml
    manualtriage:
      kind: human
      owner: manual
      text: Humans triage by hand<br/>packages/intake/HANDOFF.md
    member:
      kind: check
      text: Author is a trusted org<br/>member or collaborator?
    proposed:
      text: scaffold:proposed
    accept:
      kind: human
      text: Member applies<br/>scaffold:accepted
    triage:
      kind: ai
      text: triage<br/>flags scaffold:no-template
    needsinfo:
      text: scaffold:needs-info
    edit:
      kind: human
      text: Author edits issue,<br/>applies scaffold:triage
    gherkinwriter:
      kind: ai
      text: gherkin-writer<br/>drafts scenarios unless the form<br/>or a scenarios comment gave them
    needsgherkin:
      text: Scenarios comment, S1..Sn<br/>scaffold:needs-gherkin
    gherkinreview:
      kind: human
      text: Approver<br/>reviews scenarios
    scengate:
      kind: check
      text: Scenarios gate<br/>core timeline check: listed approver,<br/>not the author, scenarios unchanged;<br/>Gherkin parses, tagged S1..Sn
    ready:
      text: scaffold:ready
    split:
      kind: human
      owner: manual
      text: Member creates the proposed<br/>tickets as new issues,<br/>closes this one as split
    planon:
      kind: check
      text: plan stage on?<br/>stages in scaffold-config.yml
    manualplan:
      kind: human
      owner: manual
      text: Humans plan by hand<br/>packages/plan/HANDOFF.md:<br/>scaffold:planned, manual plan template,<br/>approver applies scaffold:plan-approved
    plancmd:
      kind: human
      text: Member<br/>comments /plan
    limit:
      kind: check
      text: Admit, one at a time per repo:<br/>required scenarios not approved, or<br/>in-flight limit reached?<br/>max_in_flight in scaffold-config.yml<br/>also sweeps up dropped /plan runs
    decompose:
      kind: ai
      text: task-decomposer<br/>estimate; one PR, or a stack<br/>of up to max_stack_prs PRs;<br/>maps each approved scenario to a PR
    plansize:
      kind: check
      text: Plan breaks size rules,<br/>or leaves a scenario unmapped?
    toobig:
      text: scaffold:too-big<br/>leaves flight
    retriage:
      kind: human
      text: Member applies<br/>scaffold:triage
    plancomment:
      text: Plan comment<br/>scaffold:planned
    planreview:
      kind: human
      text: Approver<br/>reviews plan
    gate:
      kind: check
      text: Plan gate<br/>core timeline check: listed approver,<br/>not the author, plan unchanged;<br/>size rules, max_stack_prs;<br/>scenarios still approved and unchanged,<br/>each mapped
    approved:
      text: scaffold:plan-approved
    implon:
      kind: check
      text: implement stage on?<br/>stages in scaffold-config.yml
    pick:
      kind: human
      owner: manual
      text: Developer picks up ticket<br/>packages/implement/HANDOFF.md
    code:
      owner: manual
      text: Developer writes code
    assign:
      kind: human
      text: Developer assigns<br/>issue to Copilot
    copilot:
      kind: ai
      text: Copilot coding agent<br/>tdd, implement skills;<br/>a stack of PRs if planned
    pr:
      text: PR, Fixes #issue
    baseline:
      kind: check
      text: Core baseline checks, every PR:<br/>protected paths, hard size limit,<br/>test integrity, scenarios<br/>with the BDD runner report
    implchecks:
      kind: check
      text: Plan gate re-checks the approval;<br/>PR size within the soft limit<br/>or scaffold:size-exception
    sizecmd:
      kind: human
      text: Developer comments /size-exception reason;<br/>listed approver applies<br/>scaffold:size-exception
    reviewgate:
      kind: check
      text: Review gate<br/>waits for every check<br/>on the head commit
    rework:
      text: Automatic rework round<br/>@copilot comment lists the failures;<br/>no human approval
    escalate:
      text: scaffold:escalate<br/>circuit breaker:<br/>max_rework_rounds used
    ci:
      kind: check
      owner: manual
      text: CI
    review:
      kind: human
      owner: manual
      text: Peer review
    test:
      kind: human
      owner: manual
      text: Ticket tested
    merge:
      owner: manual
      text: Developer merges
    closed:
      owner: manual
      text: Issue and Jira ticket closed
  edges:
    - jira --> open
    - open --> intakeon
    - intakeon -- no --> manualtriage
    - manualtriage --> ready
    - intakeon -- yes --> member
    - member -- no --> proposed
    - proposed --> accept
    - accept --> triage
    - member -- yes --> triage
    - triage --> needsinfo
    - needsinfo --> edit
    - edit --> triage
    - triage --> ready
    - triage -- scenarios needed:<br/>gherkin always, or auto<br/>and triage decides --> gherkinwriter
    - gherkinwriter --> needsgherkin
    - needsgherkin --> gherkinreview
    - gherkinreview -- member comments /gherkin:<br/>redraft --> gherkinwriter
    - gherkinreview -- applies scaffold:gherkin-approved --> scengate
    - scengate -- fails: label removed --> gherkinreview
    - scengate -- passes --> ready
    - ready -- scenarios edited or redrafted:<br/>approvals withdrawn --> needsgherkin
    - triage -- too big:<br/>proposes smaller tickets --> split
    - split --> open
    - ready --> planon
    - planon -- no --> manualplan
    - manualplan --> pick
    - planon -- yes --> plancmd
    - plancmd --> limit
    - limit -- yes, or scaffold-config.yml invalid:<br/>waits --> ready
    - limit -- no: reserves slot,<br/>scaffold:planned --> decompose
    - decompose -- fails on a first plan:<br/>slot released --> ready
    - decompose --> plansize
    - plansize -- yes, first time --> decompose
    - plansize -- no --> plancomment
    - plansize -- yes again: can't be approved --> plancomment
    - plansize -- needs more than<br/>max_stack_prs PRs --> toobig
    - toobig --> retriage
    - retriage --> triage
    - plancomment --> planreview
    - planreview -- changes needed --> plancmd
    - planreview -- applies scaffold:plan-approved --> gate
    - gate -- fails: label removed --> planreview
    - gate -- passes --> approved
    - plancomment -- plan comment deleted<br/>or its marker removed:<br/>approval withdrawn --> ready
    - approved -- plan comment edited:<br/>approval removed --> planreview
    - approved --> implon
    - implon -- no --> pick
    - pick --> code
    - code --> pr
    - implon -- yes --> assign
    - assign --> copilot
    - copilot --> pr
    - pr --> baseline
    - pr --> ci
    - pr --> implchecks
    - implchecks -- over the soft limit --> sizecmd
    - sizecmd --> implchecks
    - baseline --> reviewgate
    - ci --> reviewgate
    - implchecks --> reviewgate
    - reviewgate -- fails on a Copilot PR,<br/>rounds left --> rework
    - rework --> copilot
    - reviewgate -- fails on a human's PR --> code
    - reviewgate -- fails,<br/>max_rework_rounds used --> escalate
    - escalate --> review
    - reviewgate -- passes:<br/>review requested --> review
    - review -- changes requested --> code
    - review -- approves --> test
    - test -- fails: changes requested --> code
    - test -- passes --> merge
    - merge --> closed
