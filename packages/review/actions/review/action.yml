name: SCAFFOLD review
description: code-review (a COMMENT-only review of the PR) or ci-diagnose (explains failed CI runs on the PR), each a single tool-less Copilot CLI call. Skipped when the review stage is off.
inputs:
  mode:
    description: code-review or ci-diagnose
    required: true
  github-token:
    description: Token with contents:read, issues:write, pull-requests:write, actions:read and copilot-requests:write
    default: ${{ github.token }}
  model:
    description: Override the model for this skill's tier (packages/core/config/models.yml)
    default: ''
runs:
  using: composite
  steps:
    # Reads `stages` first (PLAN.md section 5): when review is off, nothing else runs.
    - id: stage
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/../../../core/bin/stage.mjs" review
    # Kill switch (repo or org variable SCAFFOLD_ENABLED=false): the job still runs and passes, so the
    # review gate sees its check run, but no model is called.
    - if: steps.stage.outputs.state != 'off' && env.SCAFFOLD_ENABLED == 'false'
      shell: bash
      run: echo "### SCAFFOLD review\nSkipped: kill switch (SCAFFOLD_ENABLED=false)" >> "$GITHUB_STEP_SUMMARY"
    # Pinned so a CLI release can't change flags or behaviour under a SCAFFOLD release.
    - if: steps.stage.outputs.state == 'on' && env.SCAFFOLD_ENABLED != 'false'
      shell: bash
      run: npm install -g --no-fund --no-audit @github/copilot@1.0.114
    - if: steps.stage.outputs.state != 'off' && env.SCAFFOLD_ENABLED != 'false'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SCAFFOLD_MODE: ${{ inputs.mode }}
        SCAFFOLD_MODEL: ${{ inputs.model }}
      run: node "$GITHUB_ACTION_PATH/main.mjs"
